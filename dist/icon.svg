<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Physical Altitude Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.3"/>

  <!-- Glowing Creature Center Sphere -->
  <circle cx="256" cy="256" r="96" fill="#0f172a" stroke="#f59e0b" stroke-width="6" filter="url(#glow)"/>

  <!-- Power Lightning Bolt Symbol -->
  <polygon points="272,136 216,256 260,256 240,376 312,240 264,240" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Creature Eyes -->
  <circle cx="236" cy="226" r="12" fill="#38bdf8"/>
  <circle cx="239" cy="223" r="4" fill="#ffffff"/>
  <circle cx="284" cy="226" r="12" fill="#38bdf8"/>
  <circle cx="287" cy="223" r="4" fill="#ffffff"/>
</svg>
