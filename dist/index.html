<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Power Creature Prototype 1 - Phase 1.1 Physics & Controls</title>
    <script type="module" crossorigin src="/assets/index-uek7rR8e.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CVDZeTx3.css">
  </head>
  <body>
    <div id="app-layout">
      <!-- Left Arena Viewport -->
      <div class="viewport-container">
        <header class="top-bar">
          <div class="brand-title">
            <span>⚡ Power Creature Game</span>
            <span class="brand-badge">Phase 1.1 Sandbox</span>
          </div>
        </header>

        <!-- Controls Box above game view -->
        <div class="controls-overlay-bar">
          <div class="controls-box" id="game-controls-box">
            <span class="controls-box-label">🎮 Controls</span>
            <div class="controls-box-items">
              <span class="ctrl-item"><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> Move</span>
              <span class="ctrl-divider">•</span>
              <span class="ctrl-item"><span class="key-badge">Space</span> Climb / Dismount</span>
              <span class="ctrl-divider">•</span>
              <span class="ctrl-item"><span class="key-badge">E</span> Pick Up / Drop</span>
              <span class="ctrl-divider">•</span>
              <span class="ctrl-item"><span class="key-badge">Click & Drag</span> Aim & Throw</span>
            </div>
          </div>
        </div>

        <main class="canvas-wrapper">
          <canvas id="game-canvas"></canvas>
        </main>
      </div>

      <!-- Right Dev Sidebar -->
      <aside id="dev-sidebar"></aside>
    </div>

  </body>
</html>
